server:
  port: 8080 # 指定Tomcat的监听端口

spring:
  profiles:
    active: dev
  application:
    name: nav-server # 名称
  threads:
    virtual:
      enabled: true # 开启虚拟线程
  # 数据库连接池
  datasource:
    druid:
      driver-class-name: ${nav.datasource.driver-class-name}
      url: jdbc:mysql://${nav.datasource.host}:${nav.datasource.port}/${nav.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${nav.datasource.username}
      password: ${nav.datasource.password}
      # 初始化时建立物理连接的个数、最小空闲连接数、最大活跃连接数
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接时最大等待时长（毫秒）
      max-wait: 60000
      filters: stat,wall
  # 缓存与非关系数据库redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 10MB       # 单个文件最大限制（放宽至 10MB，适应高清图和MP3）
      max-request-size: 50MB    # 单次请求总计最大限制

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动转换——数据库字段为下划线，java实体类为驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 日志设置
  global-config:
    db-config:
      id-type: assign_id

logging:
  file:
    name:nav-server.log

springdoc:
  api-docs:
    path: /v3/api-docs # 原始的 OpenAPI 元数据路径

  packages-to-scan: com.nav.controller # 严格指定只扫描业务模块下的控制器包

baidu:
  map:
    ak: hw3a0UxUnQ6mHkEJPC7WcKxrJNA0s3Ap

nav:
  jwt:
    # 管理端配置
    admin-secret-key: swuGuideAdminSecretKeyValid2026 # 签名密钥（生产环境记得修改）
    admin-ttl: 86400000                              # 令牌有效期：24小时（毫秒）
    admin-token-name: Authorization                  # 严格对齐接口文档的全局请求头字段名

    # 用户端配置（留作后续用户模块扩展）
    user-secret-key: swuGuideUserSecretKeyValid2026
    user-ttl: 2592000000                             # 用户端通常较长，如30天
    user-token-name: Authorization

    system:
      default-latitude: 29.815         # 西南大学中心点纬度
      default-longitude: 106.425       # 西南大学中心点经度
      default-scenic-id: "1"           # 默认初始加载的景点ID（如共青团花园）
      user-agreement-url: https://api.swu-guide-app.com/agreements/user.html
      privacy-policy-url: https://api.swu-guide-app.com/agreements/privacy.html
app:
  upload:
    # 物理存储路径（注意末尾保留斜杠）
    dir: D:/nav-uploads/
    # 网络访问前缀（注意末尾保留斜杠）
    base-url: http://localhost:8080/download/
